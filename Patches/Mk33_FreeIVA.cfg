// Mk33FreeIVA 0.1.0 -- KSP 1.12.5 / FreeIVA 0.2.20.2 validation candidate.
// Installed original IVA meshes are cut BEFORE identical nonconvex colliders
// are built. No original seats, models, external colliders, or part stats removed.
// BEFORE[FreeIva] also prevents guarded unfinished upstream main patches from
// deleting original seats. Other IVA replacements require separate validation.
// Do NOT add autoCutoutTargetName or later visual-only Cuts to these INTERNALs.

@PART[Mk33Cockpit]:NEEDS[FreeIva,WildBlueIndustries/Mk-33]:BEFORE[FreeIva]
{
    %MODULE[ModuleFreeIva]
    {
        %name = ModuleFreeIva
        %allowsUnbuckling = true
    }
}

@PART[wbiMk33KrewModule]:NEEDS[FreeIva,WildBlueIndustries/Mk-33]:BEFORE[FreeIva]
{
    %MODULE[ModuleFreeIva]
    {
        %name = ModuleFreeIva
        %allowsUnbuckling = true
        %deployAnimationName = Deploy
    }
}

@PART[wbiMk33Airlock]:NEEDS[FreeIva,WildBlueIndustries/Mk-33]:BEFORE[FreeIva]
{
    %MODULE[ModuleFreeIva]
    {
        %name = ModuleFreeIva
        %allowsUnbuckling = true
    }
}

@PART[wbiControlCab]:NEEDS[FreeIva,WildBlueIndustries/Mk-33]:BEFORE[FreeIva]
{
    %MODULE[ModuleFreeIva]
    {
        %name = ModuleFreeIva
        %allowsUnbuckling = true
    }
}

@PART[Mk33MidTank]:NEEDS[FreeIva,WildBlueIndustries/Mk-33]:BEFORE[FreeIva]
{
    %MODULE[ModuleFreeIva]
    {
        %name = ModuleFreeIva
        %passThroughNodeA = top
        %passThroughNodeB = MissionModuleNode1
        %allowsUnbuckling = false
    }
}

PROP:NEEDS[FreeIva]
{
    name = Mk33FreeIVA_CircularHatch
    MODEL
    {
        model = Mk33FreeIVA/Models/CircularHatch
    }
    
    MODULE
    {
        name = FreeIvaHatch
        attachNodeId =
        doorTransformName = door
        handleTransformName = handleInside
        handleTransformName = handleOutside
        inwardsDirection = 0, 1, 0
    }
}

