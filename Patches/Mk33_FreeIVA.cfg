// Mk33FreeIVA 0.3.5 -- KSP 1.12.5 / FreeIVA 0.2.20.2.
// Pressure doors are generated directly in INTERNAL before original cuts.
// The plugin assembly is required before enabling any of these walking IVAs.
// Native hatch connections and deployment checks remain in charge.
// No original seats/part statistics/exterior colliders are removed.

@PART[Mk33Cockpit]:NEEDS[Mk33FreeIVA,FreeIva,WildBlueIndustries/Mk-33]:BEFORE[FreeIva]
{
    %MODULE[ModuleFreeIva]
    {
        %name = ModuleFreeIva
        %allowsUnbuckling = true
    }
}

@PART[wbiMk33KrewModule]:NEEDS[Mk33FreeIVA,FreeIva,WildBlueIndustries/Mk-33]:BEFORE[FreeIva]
{
    %MODULE[ModuleFreeIva]
    {
        %name = ModuleFreeIva
        %allowsUnbuckling = true
        %deployAnimationName = Deploy
    }
}

@PART[wbiMk33Airlock]:NEEDS[Mk33FreeIVA,FreeIva,WildBlueIndustries/Mk-33]:BEFORE[FreeIva]
{
    %MODULE[ModuleFreeIva]
    {
